<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具书签 - 美化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
        }
        
        .category-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        
        .link-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .link-card:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        
        .nav-link {
            transition: all 0.2s;
        }
        
        .nav-link:hover {
            background-color: #f3f4f6;
        }
        
        .active {
            background-color: #e5e7eb;
            font-weight: 600;
        }
        
        .hero-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- 侧边栏 -->
        <div class="w-72 bg-white border-r border-gray-200 overflow-y-auto">
            <div class="p-6 sticky top-0 bg-white border-b">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg">📚</div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">我的工具箱</h1>
                        <p class="text-xs text-gray-500">精选书签导航</p>
                    </div>
                </div>
            </div>
            
            <div class="p-4">
                <div class="relative mb-6">
                    <input id="searchInput" 
                           type="text" 
                           placeholder="搜索工具或分类..." 
                           class="w-full bg-gray-100 border border-transparent focus:border-indigo-300 rounded-2xl py-3 px-5 pl-12 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-200">
                    <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                </div>
                
                <nav id="sidebarNav" class="space-y-1 text-sm">
                    <!-- 动态生成 -->
                </nav>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="flex-1 overflow-auto">
            <!-- 顶部栏 -->
            <header class="bg-white border-b sticky top-0 z-50">
                <div class="px-8 py-5 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <h2 id="currentCategory" class="text-2xl font-semibold text-gray-800">全部工具</h2>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div onclick="toggleDarkMode()" class="cursor-pointer w-9 h-9 flex items-center justify-center text-gray-500 hover:text-gray-700 transition-colors">
                            <i class="fas fa-moon text-xl"></i>
                        </div>
                        <a href="https://github.com" target="_blank" 
                           class="flex items-center gap-2 px-5 py-2 bg-gray-900 text-white text-sm font-medium rounded-2xl hover:bg-black transition-colors">
                            <i class="fab fa-github"></i>
                            <span>Star on GitHub</span>
                        </a>
                    </div>
                </div>
            </header>
            
            <!-- 内容 -->
            <div class="p-8" id="mainContent">
                <!-- 英雄区 -->
                <div class="hero-bg rounded-3xl p-12 text-white mb-12">
                    <div class="max-w-2xl">
                        <div class="inline-flex items-center gap-2 bg-white/20 text-white text-xs font-medium px-4 py-1.5 rounded-3xl mb-6">
                            <span class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
                            </span>
                            精选收藏
                        </div>
                        <h1 class="text-5xl font-bold mb-4 leading-tight">实用工具导航站</h1>
                        <p class="text-xl opacity-90">从媒体处理到效率工具，从学习资源到有趣收藏——一站式访问你的珍藏书签</p>
                    </div>
                </div>
                
                <!-- 分类网格 -->
                <div id="categoriesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 书签数据
        const bookmarks = [
            {
                title: "媒体工具",
                icon: "🎨",
                links: [
                    {name: "消除图片背景", url: "https://zh.bgsub.com/webapp/"},
                    {name: "提取网页图片", url: "http://www.pullywood.com/ImageAssistant/"},
                    {name: "在线拼图", url: "https://img.ops-coffee.cn/"},
                    {name: "视频转图片", url: "https://videotojpg.com/zh"},
                    {name: "B站视频下载", url: "https://i.pixcat.cn/shi-pin-xia-zai-gong-ju#bilibili-bi-li-bi-li"},
                    {name: "YouTube 视频下载 ①", url: "https://cobalt.tools/"},
                    {name: "快速抠图", url: "https://www.gaoding.com/koutu"},
                    {name: "Clipdrop", url: "https://clipdrop.co/"}
                ]
            },
            {
                title: "效率工具",
                icon: "⚡",
                links: [
                    {name: "国内大模型一览", url: "https://github.com/wgwang/awesome-LLMs-In-China"},
                    {name: "大模型排行榜", url: "https://lmarena.ai/leaderboard/"},
                    {name: "今日热榜", url: "https://tophub.today/c/news"},
                    {name: "沉浸式翻译", url: "https://immersivetranslate.com/"},
                    {name: "白板", url: "https://excalidraw.com/"},
                    {name: "代码卡片制作", url: "https://carbon.now.sh/"}
                ]
            },
            {
                title: "存储工具",
                icon: "☁️",
                links: [
                    {name: "文件快递柜", url: "https://share.lanol.cn/#/send"},
                    {name: "空投快传", url: "https://www.airportal.cn/"},
                    {name: "LocalSend", url: "https://localsend.org/zh-CN"},
                    {name: "Alist", url: "https://alist.nn.ci/zh/"}
                ]
            },
            {
                title: "检索工具",
                icon: "🔍",
                links: [
                    {name: "资源搜索导航", url: "https://iao.su/3700/"},
                    {name: "以图搜图", url: "https://i.pixcat.cn/yi-tu-sou-tu"},
                    {name: "虫部落聚合搜索", url: "https://search.chongbuluo.com/"},
                    {name: "Shodan", url: "https://www.shodan.io/"}
                ]
            },
            {
                title: "折腾工具",
                icon: "🛠️",
                links: [
                    {name: "我的Stars列表", url: "https://github.com/pixcati?tab=stars"},
                    {name: "Cloudflare 优选IP", url: "https://github.com/XIU2/CloudflareSpeedTest"},
                    {name: "Ollama", url: "https://ollama.com/"}
                ]
            },
            {
                title: "综合工具",
                icon: "🧰",
                links: [
                    {name: "MikuTools", url: "https://tools.miku.ac/"},
                    {name: "帮小忙", url: "https://tool.browser.qq.com/"},
                    {name: "AI工具导航", url: "https://www.aigc.cn/"}
                ]
            },
            {
                title: "视觉资源",
                icon: "🖼️",
                links: [
                    {name: "Wallhaven", url: "https://wallhaven.cc/"},
                    {name: "Unsplash", url: "https://unsplash.com/"},
                    {name: "阿里巴巴图标库", url: "https://www.iconfont.cn/collections/index?spm=a313x.7781069.1998910419.d33146d14&type=3"}
                ]
            },
            {
                title: "软件资源",
                icon: "💾",
                links: [
                    {name: "423down", url: "https://www.423down.com/"},
                    {name: "果核剥壳", url: "https://www.ghxi.com/"},
                    {name: "异次元软件世界", url: "https://www.iplaysoft.com/"}
                ]
            },
            {
                title: "游戏资源",
                icon: "🎮",
                links: [
                    {name: "游戏白嫖索引", url: "https://fmhy.net/gamingpiracyguide"},
                    {name: "Flashpoint", url: "https://flashpointarchive.org/"},
                    {name: "RetroArch", url: "https://www.retroarch.com/"}
                ]
            },
            {
                title: "玩机资源",
                icon: "📱",
                links: [
                    {name: "Scrcpy", url: "https://github.com/Genymobile/scrcpy"},
                    {name: "Winlator", url: "https://github.com/brunodev85/winlator"}
                ]
            },
            {
                title: "镜像资源",
                icon: "📀",
                links: [
                    {name: "Ventoy", url: "https://www.ventoy.net/cn/"},
                    {name: "清华大学镜像站", url: "https://mirrors.tuna.tsinghua.edu.cn/"}
                ]
            },
            {
                title: "WEB资源",
                icon: "🌐",
                links: [
                    {name: "W3school", url: "https://www.w3school.com.cn/"}
                ]
            },
            {
                title: "代理资源",
                icon: "🔑",
                links: [
                    {name: "Github 最新 hosts", url: "https://cdn.pixcat.cn/https://raw.githubusercontent.com/521xueweihan/GitHub520/main/hosts"}
                ]
            },
            {
                title: "影视资源",
                icon: "🎬",
                links: [
                    {name: "免费看剧", url: "https://iao.su/531/"},
                    {name: "流媒体白嫖索引", url: "https://fmhy.net/videopiracyguide"}
                ]
            },
            {
                title: "学习资源",
                icon: "📖",
                links: [
                    {name: "安娜的档案", url: "https://zh.annas-archive.org/"},
                    {name: "计算机自学指南", url: "https://csdiy.wiki/"}
                ]
            },
            {
                title: "好站收藏",
                icon: "⭐",
                links: [
                    {name: "FMHY", url: "https://fmhy.net/"},
                    {name: "不死鸟", url: "https://iao.su/"}
                ]
            },
            {
                title: "博客收藏",
                icon: "✍️",
                links: [
                    {name: "二次寒树", url: "https://echs.top/"}
                ]
            },
            {
                title: "猎奇收藏",
                icon: "🧿",
                links: [
                    {name: "AI塔罗占卜", url: "https://tarotap.com/zh"}
                ]
            },
            {
                title: "有趣收藏",
                icon: "🎉",
                links: [
                    {name: "有趣网址之家", url: "https://youquhome.com/"},
                    {name: "Mikutap", url: "https://aidn.jp/mikutap/"}
                ]
            }
        ];

        // 生成侧边栏
        function generateSidebar() {
            const nav = document.getElementById('sidebarNav');
            nav.innerHTML = `
                <a href="#" onclick="showAll()" class="nav-link active flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-700" id="nav-all">
                    <span class="text-xl">🏠</span>
                    <span>全部工具</span>
                </a>
            `;
            
            bookmarks.forEach((cat, index) => {
                const a = document.createElement('a');
                a.href = "#";
                a.className = `nav-link flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-700`;
                a.innerHTML = `
                    <span class="text-xl">${cat.icon}</span>
                    <span>${cat.title}</span>
                `;
                a.onclick = () => filterByCategory(index);
                nav.appendChild(a);
            });
        }

        // 生成分类卡片
        function generateCategories() {
            const container = document.getElementById('categoriesGrid');
            container.innerHTML = '';
            
            bookmarks.forEach((category, index) => {
                const cardHTML = `
                    <div onclick="filterByCategory(${index})" class="category-card bg-white border border-gray-100 rounded-3xl p-6 cursor-pointer group">
                        <div class="flex items-center justify-between mb-6">
                            <div class="text-4xl">${category.icon}</div>
                            <div class="text-xs font-mono bg-gray-100 text-gray-500 px-3 py-1 rounded-3xl">${category.links.length} 个</div>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-800 mb-1">${category.title}</h3>
                        <p class="text-gray-500 text-sm line-clamp-2">实用工具与资源集合</p>
                        
                        <div class="mt-8 pt-6 border-t text-xs text-indigo-600 flex items-center gap-2 group-hover:gap-3 transition-all">
                            浏览工具
                            <span class="text-lg transition-transform group-hover:translate-x-1">→</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // 显示全部
        function showAll() {
            document.getElementById('currentCategory').textContent = '全部工具';
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-all').classList.add('active');
            
            const container = document.getElementById('categoriesGrid');
            container.innerHTML = '';
            
            bookmarks.forEach((category, catIndex) => {
                const section = document.createElement('div');
                section.className = 'mb-16';
                section.innerHTML = `
                    <div class="flex items-center gap-4 mb-6">
                        <div class="text-3xl">${category.icon}</div>
                        <h2 class="text-3xl font-semibold">${category.title}</h2>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="cat-${catIndex}"></div>
                `;
                container.appendChild(section);
                
                const linksContainer = document.getElementById(`cat-${catIndex}`);
                
                category.links.forEach(link => {
                    const linkCard = document.createElement('a');
                    linkCard.href = link.url;
                    linkCard.target = "_blank";
                    linkCard.className = `link-card block bg-white border border-gray-100 hover:border-indigo-200 rounded-3xl p-5 group`;
                    linkCard.innerHTML = `
                        <div class="font-medium text-gray-800 group-hover:text-indigo-600 transition-colors">${link.name}</div>
                        <div class="text-xs text-gray-400 mt-1 truncate">${link.url}</div>
                    `;
                    linksContainer.appendChild(linkCard);
                });
            });
        }

        // 按分类过滤
        function filterByCategory(index) {
            const category = bookmarks[index];
            document.getElementById('currentCategory').textContent = category.title;
            
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            
            const container = document.getElementById('categoriesGrid');
            container.innerHTML = `
                <div class="mb-8">
                    <div class="flex items-center gap-4">
                        <div class="text-5xl">${category.icon}</div>
                        <div>
                            <h2 class="text-4xl font-bold text-gray-900">${category.title}</h2>
                            <p class="text-gray-500">${category.links.length} 个实用工具</p>
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="filtered-links"></div>
            `;
            
            const linksContainer = document.getElementById('filtered-links');
            
            category.links.forEach(link => {
                const card = document.createElement('a');
                card.href = link.url;
                card.target = "_blank";
                card.className = `link-card bg-white border border-gray-100 hover:border-indigo-200 rounded-3xl p-6 flex flex-col`;
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="font-semibold text-lg text-gray-800 mb-3">${link.name}</div>
                    </div>
                    <div class="text-xs text-gray-400 break-all">${link.url}</div>
                `;
                linksContainer.appendChild(card);
            });
        }

        // 搜索功能
        function setupSearch() {
            const input = document.getElementById('searchInput');
            
            input.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                if (!term) {
                    showAll();
                    return;
                }
                
                const container = document.getElementById('categoriesGrid');
                container.innerHTML = `<div class="col-span-full text-center py-12"><p class="text-xl text-gray-400">搜索中...</p></div>`;
                
                let results = [];
                
                bookmarks.forEach(cat => {
                    const matchedLinks = cat.links.filter(link => 
                        link.name.toLowerCase().includes(term) || 
                        link.url.toLowerCase().includes(term)
                    );
                    
                    if (matchedLinks.length > 0) {
                        results.push({category: cat.title, icon: cat.icon, links: matchedLinks});
                    }
                });
                
                if (results.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-20">
                            <div class="text-6xl mb-6">🔎</div>
                            <p class="text-xl text-gray-400">没有找到匹配的工具</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '';
                
                results.forEach(result => {
                    const section = document.createElement('div');
                    section.className = 'mb-12';
                    section.innerHTML = `
                        <div class="flex items-center gap-3 mb-6">
                            <span class="text-3xl">${result.icon}</span>
                            <h3 class="text-2xl font-medium">${result.category}</h3>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    `;
                    container.appendChild(section);
                    
                    const grid = section.querySelector('div:last-child');
                    
                    result.links.forEach(link => {
                        const el = document.createElement('a');
                        el.href = link.url;
                        el.target = "_blank";
                        el.className = "link-card bg-white border border-gray-100 hover:border-indigo-300 rounded-3xl p-6";
                        el.innerHTML = `
                            <div class="font-medium">${link.name}</div>
                            <div class="text-xs text-gray-400 mt-4 truncate">${link.url}</div>
                        `;
                        grid.appendChild(el);
                    });
                });
            });
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        }

        // 初始化
        window.onload = function() {
            generateSidebar();
            generateCategories();
            showAll();
            setupSearch();
            
            // 添加键盘支持
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.getElementById('searchInput') !== document.activeElement) {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        };
    </script>
</body>
</html>
